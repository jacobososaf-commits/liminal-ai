<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liminal AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         LIMINAL 0.9 USERNAME
         ========================================== -->

    <script>

        // Get the optional username saved by login.html.
        //
        // If there isn't one, that's completely fine.
        // Liminal will work normally.

        const liminalUsername =
            localStorage.getItem("liminalUsername");

        window.LiminalUsername =
            liminalUsername || null;

    </script>


    <div id="chat">

        <!-- HEADER -->

        <header id="header">

            <div id="title">
                Liminal AI
            </div>

            <div id="status">
                ● Online
            </div>

        </header>


        <!-- MESSAGES -->

        <main id="messages">

            <div
                class="ai welcome"
                id="welcomeMessage"
            >
                Hello, I'm Liminal AI.
            </div>

        </main>


        <!-- INPUT -->

        <footer id="inputArea">

            <input
                id="userInput"
                type="text"
                placeholder="Message Liminal AI..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button">
                Send
            </button>

            <button
                id="clearButton"
                type="button">
                Clear
            </button>

        </footer>

    </div>


    <!-- ================================
         AI FILES
         ================================ -->

    <script src="liminal.js"></script>
    <script src="aurora.js"></script>


    <script>

        const input =
            document.getElementById("userInput");

        const sendButton =
            document.getElementById("sendButton");

        const clearButton =
            document.getElementById("clearButton");

        const messages =
            document.getElementById("messages");


        // ==========================================
        // CURRENT USER
        // ==========================================

        const currentUsername =
            window.LiminalUsername || null;


        // ==========================================
        // PERSONALIZED WELCOME
        // ==========================================

        const welcomeMessage =
            document.getElementById("welcomeMessage");


        if (
            welcomeMessage &&
            currentUsername
        ) {

            welcomeMessage.textContent =
                `Hello ${currentUsername}, I'm Liminal AI.`;

        }


        // ==========================================
        // CURRENT AI
        // ==========================================

        let currentAI = "liminal";


        // ==========================================
        // ADD MESSAGE
        // ==========================================

        function addMessage(name, text, type) {

            const message =
                document.createElement("div");

            message.className = type;


            const nameElement =
                document.createElement("div");

            nameElement.className =
                "message-name";

            nameElement.textContent =
                name;


            const textElement =
                document.createElement("div");

            textElement.className =
                "message-text";

            textElement.textContent =
                text;


            message.appendChild(nameElement);
            message.appendChild(textElement);

            messages.appendChild(message);

            messages.scrollTop =
                messages.scrollHeight;
        }


        // ==========================================
        // UPDATE HEADER
        // ==========================================

        function updateAIName() {

            const title =
                document.getElementById("title");


            if (
                currentAI === "aurora"
            ) {

                title.textContent =
                    "Aurora";

            } else {

                title.textContent =
                    "Liminal AI";

            }

        }


        // ==========================================
        // ROUTE MESSAGE
        // ==========================================

        async function routeMessage() {

            const raw =
                input.value.trim();


            if (!raw) return;


            const command =
                raw.toLowerCase();


            input.value = "";


            // ======================================
            // SWITCH TO AURORA
            // ======================================

            if (
                command === "!aurora"
            ) {

                currentAI =
                    "aurora";


                addMessage(
                    "You",
                    raw,
                    "user"
                );


                if (
                    window.Aurora &&
                    typeof window.Aurora.resetState ===
                    "function"
                ) {

                    window.Aurora.resetState();

                }


                updateAIName();


                addMessage(
                    "Aurora",
                    "Hello. I'm Aurora. 🌌",
                    "ai"
                );


                return;
            }


            // ======================================
            // SWITCH TO LIMINAL
            // ======================================

            if (
                command === "!liminal"
            ) {

                currentAI =
                    "liminal";


                addMessage(
                    "You",
                    raw,
                    "user"
                );


                updateAIName();


                addMessage(
                    "Liminal AI",
                    "Hello! I'm Liminal AI 0.8.",
                    "ai"
                );


                return;
            }


            // ======================================
            // NORMAL MESSAGE
            // ======================================

            addMessage(
                "You",
                raw,
                "user"
            );


            // ======================================
            // AURORA
            // ======================================

            if (
                currentAI === "aurora"
            ) {

                const ai =
                    document.createElement("div");

                ai.className =
                    "ai";


                const name =
                    document.createElement("div");

                name.className =
                    "message-name";

                name.textContent =
                    "Aurora";


                const text =
                    document.createElement("div");

                text.className =
                    "message-text";

                text.textContent =
                    "Thinking... 🤔";


                ai.appendChild(name);
                ai.appendChild(text);

                messages.appendChild(ai);


                try {

                    if (
                        window.Aurora &&
                        typeof window.Aurora.respond ===
                        "function"
                    ) {

                        const response =
                            await window.Aurora.respond(
                                raw
                            );


                        text.textContent =
                            response;

                    } else {

                        text.textContent =
                            "Aurora is not available.";

                    }

                } catch (error) {

                    console.error(
                        "Aurora error:",
                        error
                    );


                    text.textContent =
                        "Aurora encountered an error.";

                }


                messages.scrollTop =
                    messages.scrollHeight;


                return;
            }


            // ======================================
            // LIMINAL
            // ======================================

            const ai =
                document.createElement("div");

            ai.className =
                "ai";


            const name =
                document.createElement("div");

            name.className =
                "message-name";

            name.textContent =
                "Liminal AI";


            const text =
                document.createElement("div");

            text.className =
                "message-text";

            text.textContent =
                "Thinking... 🤔";


            ai.appendChild(name);
            ai.appendChild(text);

            messages.appendChild(ai);


            try {

                // ==================================
                // USE LIMINAL'S PUBLIC RESPONDER
                //
                // This keeps:
                // - Memory
                // - Corrections
                // - Math
                // - Web search
                // - Mood
                // - Existing logic
                // ==================================

                if (
                    window.Liminal &&
                    typeof window.Liminal.respond ===
                    "function"
                ) {

                    text.textContent =
                        await window.Liminal.respond(
                            raw
                        );

                } else {

                    text.textContent =
                        "Liminal AI is not available.";

                }

            } catch (error) {

                console.error(
                    "Liminal error:",
                    error
                );


                text.textContent =
                    "Liminal AI encountered an error.";

            }


            messages.scrollTop =
                messages.scrollHeight;

        }


        // ==========================================
        // SEND BUTTON
        // ==========================================

        sendButton.addEventListener(
            "click",
            routeMessage
        );


        // ==========================================
        // ENTER KEY
        // ==========================================

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    routeMessage();

                }

            }
        );


        // ==========================================
        // CLEAR BUTTON
        // ==========================================

        clearButton.addEventListener(
            "click",
            function() {

                messages.innerHTML = "";


                currentAI =
                    "liminal";


                updateAIName();


                const welcome =
                    document.createElement("div");

                welcome.className =
                    "ai welcome";


                if (currentUsername) {

                    welcome.textContent =
                        `Hello ${currentUsername}, I'm Liminal AI.`;

                } else {

                    welcome.textContent =
                        "Hello, I'm Liminal AI.";

                }


                messages.appendChild(
                    welcome
                );


                if (
                    window.Aurora &&
                    typeof window.Aurora.resetState ===
                    "function"
                ) {

                    window.Aurora.resetState();

                }

            }
        );


        // ==========================================
        // THEME BUTTON
        // ==========================================

        const themeButton =
            document.createElement("button");


        themeButton.id =
            "themeButton";


        themeButton.type =
            "button";


        themeButton.textContent =
            "☀️";


        document
            .getElementById("header")
            .appendChild(themeButton);


        themeButton.addEventListener(
            "click",
            function() {

                document.body.classList.toggle(
                    "light-mode"
                );


                const light =
                    document.body.classList.contains(
                        "light-mode"
                    );


                localStorage.setItem(
                    "liminalTheme",
                    light
                        ? "light"
                        : "dark"
                );


                themeButton.textContent =
                    light
                        ? "🌙Dark"
                        : "☀️Light";

            }
        );


        // ==========================================
        // LOAD THEME
        // ==========================================

        if (
            localStorage.getItem(
                "liminalTheme"
            ) === "light"
        ) {

            document.body.classList.add(
                "light-mode"
            );


            themeButton.textContent =
                "🌙";

        }

    </script>

</body>
</html>
