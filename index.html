
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<script>
    const savedUsername = localStorage.getItem("liminalUsername");

    if (!savedUsername || !savedUsername.trim()) {
        window.location.replace("login.html");
    }

    window.LiminalUsername = savedUsername || null;
</script>

<div id="chat">
    <header id="header">
        <div id="title">Liminal AI</div>
        <div id="status">● Online</div>
    </header>

    <main id="messages">
        <div class="ai welcome" id="welcomeMessage">
            Hello, I'm Liminal AI.
        </div>
    </main>

    <footer id="inputArea">
        <input
            id="userInput"
            type="text"
            placeholder="Message Liminal AI..."
            autocomplete="off"
        >

        <button id="sendButton" type="button">Send</button>
        <button id="clearButton" type="button">Clear</button>
    </footer>
</div>

<!-- LOCAL AGENT ENGINES -->
<script src="liminal.js"></script>
<script src="aurora.js"></script>
<script src="jen.js"></script>

<script>
    const input = document.getElementById("userInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const messages = document.getElementById("messages");
    const welcomeMessage = document.getElementById("welcomeMessage");

    const currentUsername = window.LiminalUsername || null;

    function getRandomGreeting(username) {
        const greetings = [
            `Hello ${username}, I'm Liminal AI.`,
            `Hey ${username}! What are we doing today?`,
            `Yo ${username} 👋 What are we working on?`,
            `Welcome back, ${username}. What's on your mind?`,
            `Hey ${username}! Ready to build something? 🔥`,
            `So, ${username}... what are we getting into today?`,
            `I'm here, ${username}. What's up?`,
            `What's up, ${username}? 😎`,
            `Hey ${username}! What can I help you with today?`,
            `Welcome back, ${username}.`
        ];

        return greetings[Math.floor(Math.random() * greetings.length)];
    }

    if (welcomeMessage && currentUsername) {
        welcomeMessage.textContent = getRandomGreeting(currentUsername);
    }

    let currentAI = "liminal";

    function addMessage(name, text, type) {
        const message = document.createElement("div");
        message.className = type;

        const nameElement = document.createElement("div");
        nameElement.className = "message-name";
        nameElement.textContent = name;

        const textElement = document.createElement("div");
        textElement.className = "message-text";
        textElement.textContent = text;

        message.appendChild(nameElement);
        message.appendChild(textElement);
        messages.appendChild(message);

        messages.scrollTop = messages.scrollHeight;
    }

    function updateAIName() {
        const title = document.getElementById("title");

        const names = {
            liminal: "Liminal AI",
            aurora: "Aurora",
            jen: "Jen"
        };

        title.textContent = names[currentAI] || "Liminal AI";
        input.placeholder = `Message ${names[currentAI] || "Liminal AI"}...`;
    }

    function createThinkingMessage(name) {
        const ai = document.createElement("div");
        ai.className = "ai";

        const nameElement = document.createElement("div");
        nameElement.className = "message-name";
        nameElement.textContent = name;

        const textElement = document.createElement("div");
        textElement.className = "message-text";
        textElement.textContent = "Thinking... 🤔";

        ai.appendChild(nameElement);
        ai.appendChild(textElement);
        messages.appendChild(ai);

        messages.scrollTop = messages.scrollHeight;

        return textElement;
    }

    function resetAgent(agentName) {
        const agent = {
            liminal: window.Liminal,
            aurora: window.Aurora,
            jen: window.Jen
        }[agentName];

        if (agent && typeof agent.resetState === "function") {
            agent.resetState();
        }
    }

    function switchAgent(agentName, raw) {
        currentAI = agentName;

        addMessage("You", raw, "user");
        resetAgent(agentName);
        updateAIName();

        const greetings = {
            liminal: "Hello! I'm Liminal AI 0.8.2",
            aurora: "Hello. I'm Aurora. 🌌",
            jen: "Hey! I'm Jen. ✨"
        };

        addMessage(
            agentName === "liminal" ? "Liminal AI" :
            agentName === "aurora" ? "Aurora" : "Jen",
            greetings[agentName],
            "ai"
        );
    }

    async function routeMessage() {
        const raw = input.value.trim();

        if (!raw) return;

        const command = raw.toLowerCase();
        input.value = "";

        // AGENT SWITCHING
        if (["!liminal", "!aurora", "!jen"].includes(command)) {
            const agentName = command.slice(1);
            switchAgent(agentName, raw);
            return;
        }

        addMessage("You", raw, "user");

        const agents = {
            liminal: {
                label: "Liminal AI",
                engine: window.Liminal
            },
            aurora: {
                label: "Aurora",
                engine: window.Aurora
            },
            jen: {
                label: "Jen",
                engine: window.Jen
            }
        };

        const selected = agents[currentAI];
        const text = createThinkingMessage(selected.label);

        try {
            if (
                selected.engine &&
                typeof selected.engine.respond === "function"
            ) {
                const response = await selected.engine.respond(raw);
                text.textContent = String(response ?? "");
            } else {
                text.textContent =
                    `${selected.label} is not available. Check that its JavaScript file loaded correctly.`;
            }
        } catch (error) {
            console.error(`${selected.label} error:`, error);
            text.textContent = `${selected.label} encountered an error.`;
        }

        messages.scrollTop = messages.scrollHeight;
    }

    sendButton.addEventListener("click", routeMessage);

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            routeMessage();
        }
    });

    clearButton.addEventListener("click", function() {
        messages.innerHTML = "";
        currentAI = "liminal";

        resetAgent("liminal");
        resetAgent("aurora");
        resetAgent("jen");

        updateAIName();

        const welcome = document.createElement("div");
        welcome.className = "ai welcome";

        welcome.textContent = currentUsername
            ? getRandomGreeting(currentUsername)
            : "Hello, I'm Liminal AI.";

        messages.appendChild(welcome);
    });

    // THEME BUTTON
    const themeButton = document.createElement("button");
    themeButton.id = "themeButton";
    themeButton.type = "button";
    themeButton.textContent = "☀️";

    document.getElementById("header").appendChild(themeButton);

    themeButton.addEventListener("click", function() {
        document.body.classList.toggle("light-mode");

        const light = document.body.classList.contains("light-mode");

        localStorage.setItem("liminalTheme", light ? "light" : "dark");
        themeButton.textContent = light ? "🌙Dark" : "☀️Light";
    });

    // RESTORE SAVED THEME
    if (localStorage.getItem("liminalTheme") === "light") {
        document.body.classList.add("light-mode");
        themeButton.textContent = "🌙Dark";
    }

    updateAIName();
</script>

</body>
</html>
