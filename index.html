<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Liminal AI 0.75</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div id="chat">


    <!-- HEADER -->


    <div id="header">


        <div id="title">
            🤖 Liminal AI 0.75
        </div>


        <div id="headerControls">


            <div id="status">
                🟡 Connecting...
            </div>


            <button
                id="themeButton"
                onclick="toggleTheme()"
            >
                ☀️ Light
            </button>


        </div>


    </div>



    <!-- MESSAGES -->


    <div id="messages">


        <div class="ai">
            Hello! I'm Liminal AI 0.75.
        </div>


    </div>



    <!-- INPUT -->


    <div id="inputArea">


        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
            autocomplete="off"
        >


        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>


        <button
            id="clearButton"
            onclick="clearChat()"
        >
            Clear
        </button>


    </div>


</div>



<script src="script.js"></script>


</body>

</html>
