<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liminal — Welcome</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #111;
            color: white;
        }

        /* ==========================================
           BACKGROUND
        ========================================== */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #ffe66d 0%,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #ffcc00 0%,
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #161616,
                    #252525
                );
        }

        .blob {
            position: absolute;

            border-radius: 50%;

            filter: blur(5px);

            opacity: 0.5;

            animation:
                float 12s ease-in-out infinite alternate;
        }

        .blob.one {
            width: 400px;
            height: 400px;

            background: #ffd83d;

            top: -150px;
            left: -100px;

            animation-duration: 14s;
        }

        .blob.two {
            width: 350px;
            height: 350px;

            background: #ff9f1c;

            bottom: -120px;
            right: -80px;

            animation-duration: 11s;
            animation-delay: -3s;
        }

        .blob.three {
            width: 180px;
            height: 180px;

            background: #fff3a3;

            top: 45%;
            left: 65%;

            animation-duration: 9s;
            animation-delay: -5s;
        }

        @keyframes float {

            0% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(80px, -50px)
                    scale(1.15);
            }

            100% {
                transform:
                    translate(-50px, 70px)
                    scale(0.9);
            }
        }

        /* ==========================================
           PARTICLES
        ========================================== */

        .particle {
            position: absolute;

            width: 5px;
            height: 5px;

            background: white;

            border-radius: 50%;

            opacity: 0;

            animation:
                particleFloat
                linear
                infinite;
        }

        .p1 {
            left: 10%;
            bottom: -20px;
            animation-duration: 9s;
        }

        .p2 {
            left: 25%;
            bottom: -20px;
            animation-duration: 12s;
            animation-delay: 2s;
        }

        .p3 {
            left: 50%;
            bottom: -20px;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .p4 {
            left: 75%;
            bottom: -20px;
            animation-duration: 11s;
            animation-delay: 4s;
        }

        .p5 {
            left: 90%;
            bottom: -20px;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        @keyframes particleFloat {

            0% {
                transform: translateY(0);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            85% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }

        /* ==========================================
           LIMINAL CARD
        ========================================== */

        .login-card {
            position: relative;
            z-index: 10;

            width: 90%;
            max-width: 430px;

            padding: 45px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.20);

            border-radius: 28px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px rgba(255, 255, 255, 0.25);

            animation:
                cardEnter
                1s
                cubic-bezier(.16,1,.3,1)
                forwards;

            opacity: 0;

            transform:
                translateY(50px)
                scale(0.92);
        }

        @keyframes cardEnter {

            0% {
                opacity: 0;

                transform:
                    translateY(50px)
                    scale(0.92);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* ==========================================
           LOGO
        ========================================== */

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #fff06a,
                    #ffc400
                );

            color: #222;

            font-size: 28px;

            box-shadow:
                0 10px 35px
                rgba(255, 210, 40, 0.45);

            animation:
                logoFloat
                3s
                ease-in-out
                infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-7px)
                    rotate(2deg);
            }
        }

        /* ==========================================
           TEXT
        ========================================== */

        h1 {
            text-align: center;

            font-size: 32px;

            margin-bottom: 8px;

            letter-spacing: -1px;

            animation:
                textEnter
                0.8s
                0.3s
                both;
        }

        .subtitle {
            text-align: center;

            color:
                rgba(255, 255, 255, 0.65);

            margin-bottom: 32px;

            animation:
                textEnter
                0.8s
                0.4s
                both;
        }

        @keyframes textEnter {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==========================================
           USERNAME
        ========================================== */

        .input-group {
            position: relative;

            margin-bottom: 25px;

            animation:
                inputEnter
                0.7s
                0.5s
                both;
        }

        @keyframes inputEnter {

            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            color:
                rgba(255, 255, 255, 0.8);

            font-weight: bold;
        }

        .input-group input {
            width: 100%;

            padding: 15px 16px;

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            border-radius: 13px;

            background:
                rgba(0, 0, 0, 0.20);

            color: white;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.3s,
                box-shadow 0.3s,
                transform 0.3s,
                background 0.3s;
        }

        .input-group input::placeholder {
            color:
                rgba(255, 255, 255, 0.35);
        }

        .input-group input:hover {
            background:
                rgba(0, 0, 0, 0.28);

            transform:
                translateY(-1px);
        }

        .input-group input:focus {
            border-color: #ffd83d;

            background:
                rgba(0, 0, 0, 0.30);

            transform:
                translateY(-2px);

            box-shadow:
                0 0 0 4px
                rgba(255, 216, 61, 0.12),

                0 10px 30px
                rgba(0, 0, 0, 0.20);
        }

        /* ==========================================
           BUTTON
        ========================================== */

        button {
            position: relative;

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #fff06a,
                    #ffc400
                );

            color: #222;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform 0.25s,
                box-shadow 0.25s;

            box-shadow:
                0 10px 30px
                rgba(255, 200, 30, 0.30);

            animation:
                buttonEnter
                0.8s
                0.7s
                both;
        }

        @keyframes buttonEnter {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.7),
                    transparent
                );

            transform: skewX(-20deg);

            transition: 0.6s;
        }

        button:hover::before {
            left: 140%;
        }

        button:hover {
            transform:
                translateY(-3px)
                scale(1.01);

            box-shadow:
                0 15px 40px
                rgba(255, 200, 30, 0.45);
        }

        button:active {
            transform:
                translateY(0)
                scale(0.98);
        }

        /* ==========================================
           PROTOTYPE NOTE
        ========================================== */

        .note {
            text-align: center;

            margin-top: 22px;

            color:
                rgba(255, 255, 255, 0.45);

            font-size: 12px;

            animation:
                fadeIn
                0.8s
                0.8s
                both;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 480px) {

            .login-card {
                padding: 32px 25px;
                border-radius: 22px;
            }

            h1 {
                font-size: 27px;
            }

            .logo {
                width: 58px;
                height: 58px;
            }
        }

    </style>
</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <div class="blob one"></div>
        <div class="blob two"></div>
        <div class="blob three"></div>

        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>

    </div>


    <!-- Liminal Welcome -->

    <div class="login-card">

        <div class="logo">
            ◆
        </div>

        <h1>
            Welcome to Liminal
        </h1>

        <p class="subtitle">
            What should I call you?
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="juggy"
                    autocomplete="username"
                    required
                >

            </div>


            <button type="submit">
                Enter Liminal
            </button>

        </form>


        <p class="note">
            Prototype • Liminal 0.9 idea
        </p>

    </div>


    <script>

        const form =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("username");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                usernameInput.value.trim();

            if (!username) {
                return;
            }

            // Prototype only.
            // This is where Liminal 0.9
            // would eventually save/use the username.

            localStorage.setItem(
                "liminalUsername",
                username
            );

            alert(
                `Welcome to Liminal, ${username}!`
            );

        });

    </script>

</body>
</html>
